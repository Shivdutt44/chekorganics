# Refreshes the homepage Instagram feed (instagram.json + assets/instagram/) once a day.
# Setup: add a long-lived Instagram API access token as the repository secret IG_ACCESS_TOKEN
# (Settings → Secrets and variables → Actions). Without the secret the job does nothing.
name: Instagram feed

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools (sharp)
        run: npm ci --no-audit --no-fund
        working-directory: .build

      - name: Fetch latest posts
        run: node fetch-instagram.mjs
        working-directory: .build
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Commit changes
        run: |
          git add instagram.json assets/instagram 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Feed unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update Instagram feed"
            git push
          fi
